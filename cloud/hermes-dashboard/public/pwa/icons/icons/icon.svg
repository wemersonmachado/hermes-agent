<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Arredondado Estilo App Móvel -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(59,130,246,0.3)" stroke-width="6"/>

  <!-- Anel Neon Orbital -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="url(#brainGrad)" stroke-width="8" stroke-dasharray="24 12" filter="url(#glow)" opacity="0.8"/>
  <circle cx="256" cy="240" r="130" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Ícone do Cérebro Neural / VALIA -->
  <path d="M 256 130 C 200 130 150 170 150 230 C 150 270 175 305 210 320 L 210 350 C 210 360 220 370 230 370 L 282 370 C 292 370 302 360 302 350 L 302 320 C 337 305 362 270 362 230 C 362 170 312 130 256 130 Z" fill="none" stroke="url(#brainGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Núcleo de Energia Neon -->
  <circle cx="256" cy="225" r="30" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="225" r="14" fill="#ffffff"/>

  <!-- Linha de Pulso de Áudio Waveform -->
  <path d="M 170 410 L 200 410 L 220 390 L 240 430 L 260 380 L 280 420 L 300 400 L 320 410 L 340 410" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Texto VALIÁ PWA -->
  <text x="256" y="475" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">VALIÁ PWA</text>
</svg>